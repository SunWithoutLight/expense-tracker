<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash">
    <svg viewBox="0 0 300 300" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="topHalf"><rect x="0" y="0" width="300" height="150"/></clipPath>
        <clipPath id="bottomHalf"><rect x="0" y="150" width="300" height="150"/></clipPath>
      </defs>
      <rect x="0" y="0" width="300" height="150" fill="#71767b"/>
      <rect x="0" y="150" width="300" height="150" fill="#d3d5d7"/>
      <rect x="0" y="148" width="300" height="4" fill="#2e2f31" opacity="0.35"/>
      <g font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="1.5" text-anchor="middle">
        <text x="150" y="158" clip-path="url(#topHalf)" fill="#f6f6f6">TrackExpense</text>
        <text x="150" y="158" clip-path="url(#bottomHalf)" fill="#25272a">TrackExpense</text>
      </g>
    </svg>
  </div>

  <div class="app hidden" id="app">
    <header class="app-header">
      <svg class="header-logo" viewBox="0 0 300 300" width="64" height="64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TrackExpense">
        <defs>
          <clipPath id="topHalfHeader"><rect x="0" y="0" width="300" height="150"/></clipPath>
          <clipPath id="bottomHalfHeader"><rect x="0" y="150" width="300" height="150"/></clipPath>
        </defs>
        <rect x="0" y="0" width="300" height="150" fill="#71767b"/>
        <rect x="0" y="150" width="300" height="150" fill="#d3d5d7"/>
        <rect x="0" y="148" width="300" height="4" fill="#2e2f31" opacity="0.35"/>
        <g font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="1.5" text-anchor="middle">
          <text x="150" y="158" clip-path="url(#topHalfHeader)" fill="#f6f6f6">TrackExpense</text>
          <text x="150" y="158" clip-path="url(#bottomHalfHeader)" fill="#25272a">TrackExpense</text>
        </g>
      </svg>
      <div class="user-bar">
        <span id="userEmailLabel"></span>
        <button id="logoutBtn" class="link-btn">Log out</button>
      </div>
      <div class="month-nav">
        <button id="prevMonth" class="icon-btn" aria-label="Previous month">&#8592;</button>
        <h2 id="monthLabel"></h2>
        <button id="nextMonth" class="icon-btn" aria-label="Next month">&#8594;</button>
      </div>
    </header>

    <div class="main-grid">
      <section class="calendar-wrap">
        <div class="weekday-row" id="weekdayRow"></div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </section>

      <section class="summary" id="summary">
        <h2>Month summary</h2>
        <div class="summary-total" id="summaryTotal">$0.00</div>
        <div class="summary-breakdown" id="summaryBreakdown"></div>
      </section>
    </div>
  </div>

  <div class="auth-screen hidden" id="authScreen">
    <div class="auth-card">
      <h2 id="authTitle">Sign in</h2>
      <form id="authForm">
        <input id="authEmail" type="email" placeholder="Email" autocomplete="email" required>
        <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password" minlength="6" required>
        <div class="auth-error" id="authError"></div>
        <button type="submit" class="add-btn" id="authSubmitBtn">Sign in</button>
      </form>
      <p class="auth-toggle">
        <span id="authToggleText">Don't have an account?</span>
        <button type="button" id="authToggleBtn" class="link-btn">Sign up</button>
      </p>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalDate">
      <div class="modal-header">
        <h3 id="modalDate"></h3>
        <button class="icon-btn" id="closeModal" aria-label="Close">&times;</button>
      </div>

      <ul class="entry-list" id="entryList"></ul>
      <div class="day-total" id="dayTotal"></div>

      <form id="entryForm" class="entry-form">
        <div class="form-row">
          <select id="categorySelect" required></select>
          <input id="amountInput" type="number" step="0.01" min="0.01" placeholder="Amount" required>
        </div>
        <input id="customCategoryInput" type="text" placeholder="Category name" maxlength="30" class="hidden">
        <input id="noteInput" type="text" placeholder="Note (optional)" maxlength="120">
        <button type="submit" class="add-btn">Add expense</button>
      </form>
    </div>
  </div>

<script type="module" src="app.js"></script>
</body>
</html>
